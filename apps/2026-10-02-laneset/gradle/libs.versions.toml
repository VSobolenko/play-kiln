[versions]
agp = "9.4.1"                 # latest stable; built-in Kotlin, R8 full mode by default
kotlin = "2.3.21"             # Compose compiler plugin version must match Kotlin
composeBom = "2026.09.00"     # latest stable Compose BOM
coreKtx = "1.19.0"            # Kotlin extensions for Android framework APIs
lifecycle = "2.11.0"          # Compose-aware lifecycle and ViewModel integration
activityCompose = "1.13.0"    # Compose activity host integration
navigation3 = "1.1.7"         # aligned Navigation 3 runtime and UI artifacts
datastore = "1.2.1"           # preferences persistence without a database
serialization = "1.11.0"      # kotlinx.serialization runtime; Navigation 3's own back stack needs it
profileInstaller = "1.4.1"    # installs bundled baseline profiles on devices
baselineProfilePlugin = "1.5.0" # generates and packages baseline profiles
junit = "4.13.2"              # local JVM unit-test runner
androidxJunit = "1.3.0"       # Android instrumentation test integration
espresso = "3.7.0"            # Android UI test APIs
benchmarkMacro = "1.4.1"      # macrobenchmark and baseline-profile test APIs
# The slot's economics plan (archetype `purchase_led_single_unlock`) requires the `billing`
# capability, so a billing library is part of the shipped APK. Pin the stable Play Billing release
# the factory's billing capability itself resolves, so only one billing artifact version is ever on
# the compile classpath.
billing = "9.1.0"             # Google Play Billing Library (billing-ktx)
capabilityVersion = "1.0.0"   # com.gexetr.capability:* artifacts the factory publishes to mavenLocal
# Play notice 2026-10-05: fragment:1.1.0 via billing→play-services-basement. Constraint only —
# Compose apps do not use Fragment UI. See .cursor/rules/dependency-freshness.mdc.
fragment = "1.9.1"            # forces the Billing→GMS transitive off Play-flagged 1.1.0

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfilePlugin" }

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Pane-level adaptivity: `rememberListDetailSceneStrategy` decides whether a list entry and its detail
# entry are two panes or one. BOM-managed, like `androidx-compose-material3` above, so the Compose BOM
# owns the version.
androidx-compose-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# Play Billing, both halves of it: the factory's `billing` capability (entitlement state that
# survives process death, purchase acknowledgement, pending-purchase recovery) and the raw Play
# Billing SDK it wraps, so the slot is never boxed in by the abstraction. Both resolve the same
# billing-ktx version, so one billing library enters the APK.
capability-billing = { module = "com.gexetr.capability:billing", version.ref = "capabilityVersion" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }

# How to extend a slot later
# Room: androidx.room:room-runtime, androidx.room:room-ktx, and androidx.room:room-compiler; plugin com.google.devtools.ksp.
# KSP must be added with the same version as Kotlin.
# Koin: io.insert-koin:koin-androidx-compose.
# Hilt: com.google.dagger:hilt-android; plugin com.google.dagger.hilt.android.
# WorkManager: androidx.work:work-runtime-ktx.
