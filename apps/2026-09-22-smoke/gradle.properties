# Give Gradle adequate heap and metaspace while keeping text encoding deterministic.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Build independent projects in parallel to reduce build time.
org.gradle.parallel=true
# Reuse task outputs across builds when inputs have not changed.
org.gradle.caching=true
# Reuse the configured task graph across compatible builds.
org.gradle.configuration-cache=true
# Use AndroidX libraries and namespaces.
android.useAndroidX=true
# Keep each module's R class limited to its own resources.
android.nonTransitiveRClass=true
# Apply Kotlin's official source formatting conventions.
kotlin.code.style=official
# Suppress the AGP warning while compiling against the intentionally newer API 37 SDK.
android.suppressUnsupportedCompileSdk=37
