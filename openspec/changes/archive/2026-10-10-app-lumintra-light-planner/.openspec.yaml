schema: spec-driven
created: 2026-10-08
goal: Ship a light-and-sky session planner that an outdoor, landscape or night
  photographer owns outright — one scrubbable Night scene that takes a saved spot,
  a night and a lens and answers when it is actually dark, where the moon is, which
  of roughly 250 famous deep-sky objects will be up and for how long, whether a
  satellite will streak the exposure, and what the clouds will do, with the user's
  own drawn horizon silhouette in the foreground and the real sky above it — and
  turns that scene into a session brief that is shared as a postcard or a text
  brief, unlocked once at $9.99 instead of rented monthly.
