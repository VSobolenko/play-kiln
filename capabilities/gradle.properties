# Shared Gradle settings for the capabilities build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compose 1.12-era tooling requires compileSdk 37; the warning is expected and intentional.
android.suppressUnsupportedCompileSdk=37
# Single version for every capability artifact. Bump it, publish, then update slots.
playkiln.capabilityVersion=1.0.0
