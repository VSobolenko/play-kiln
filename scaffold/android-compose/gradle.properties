# Give Gradle adequate heap and metaspace while keeping text encoding deterministic.
# Measured on this factory's machine (16 GB RAM): -Xmx3072m plus a 1 GB metaspace reserve and a
# Kotlin compile daemon made the OS fail to commit the G1 virtual space, and the daemon died with
# "Native memory allocation (mmap) failed to map 717225984 bytes for G1 virtual space", leaving an
# hs_err_pid log in the slot. 2 GiB is ample for a single-module Compose app; raise it only with a
# measurement, never by preference. See .cursor/rules/build-speed.mdc.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Keep the Kotlin compile daemon inside the same budget instead of adding a second JVM.
kotlin.daemon.jvmargs=-Xmx1024m
# Build independent projects in parallel to reduce build time.
org.gradle.parallel=true
# Reuse task outputs across builds when inputs have not changed.
org.gradle.caching=true
# Reuse the configured task graph across compatible builds.
org.gradle.configuration-cache=true
# Use AndroidX libraries and namespaces.
android.useAndroidX=true
# Keep each module's R class limited to its own resources.
android.nonTransitiveRClass=true
# Apply Kotlin's official source formatting conventions.
kotlin.code.style=official
# Suppress the AGP warning while compiling against the intentionally newer API 37 SDK.
android.suppressUnsupportedCompileSdk=37
